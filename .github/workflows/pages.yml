name: Deploy snow atelier to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check code and workflow adaptation
        run: |
          node --check server.mjs
          node --check launcher.mjs
          node --check publisher.mjs
          node --check auth.mjs
          node --check public/app.js
          node --test tests/*.test.mjs
      - name: Stamp asset versions to prevent stale mobile caches
        run: node stamp-assets.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
